# Serve static assets. Mount the "public" folder of the @ilo-org/twig package at the path below when
# running the container. Only files that exist in that folder are served from
# it: every other request is handled by Drupal as usual.
Define ILO_PUBLIC_ASSETS /opt/drupal/modules/ilo_base_theme_companion/public

<Directory ${ILO_PUBLIC_ASSETS}>
    Require all granted
</Directory>

RewriteEngine On
RewriteCond ${ILO_PUBLIC_ASSETS}%{REQUEST_URI} -f
RewriteRule ^ ${ILO_PUBLIC_ASSETS}%{REQUEST_URI} [L]
